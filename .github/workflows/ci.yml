name: Verify

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Validate pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: >-
          pnpm exec commitlint --from "${{ github.event.before }}"
          --to "${{ github.sha }}" --verbose

      - name: Validate an initial push
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: >-
          pnpm exec commitlint --from "$(git rev-list --max-parents=0 HEAD)"
          --to "${{ github.sha }}" --verbose

  verify:
    name: Test, validate, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the complete verification suite
        run: pnpm check

      - name: Upload browser packages
        uses: actions/upload-artifact@v7
        with:
          name: formfully-browser-packages-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  safari:
    name: Build Safari extension
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Safari web extension
        run: pnpm build:extension safari

      - name: Convert to an Xcode project
        run: |
          xcrun safari-web-extension-converter apps/extension/dist/safari \
            --project-location "$RUNNER_TEMP/safari" \
            --app-name "FormFully" \
            --bundle-identifier io.github.devm7mdali.formfully \
            --swift --macos-only --copy-resources \
            --no-open --no-prompt --force

      - name: Build the unsigned Safari app extension
        run: |
          project="$(find "$RUNNER_TEMP/safari" -maxdepth 2 -name '*.xcodeproj' -print -quit)"
          if [ -z "$project" ]; then
            echo "The converter produced no Xcode project" >&2
            exit 1
          fi
          target="$(xcodebuild -list -project "$project" -json |
            node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).project.targets.find((name) => name.endsWith("Extension"))')"
          if [ "$target" = "undefined" ]; then
            echo "The converted project has no extension target" >&2
            exit 1
          fi
          xcodebuild build \
            -project "$project" \
            -target "$target" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload the Safari Xcode project
        uses: actions/upload-artifact@v7
        with:
          name: formfully-safari-xcode-${{ github.sha }}
          path: |
            ${{ runner.temp }}/safari
            !${{ runner.temp }}/safari/**/build/**
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create a versioned GitHub Release
    needs: [commitlint, verify, safari]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: semantic-release-main
      cancel-in-progress: false

    steps:
      - name: Check out the verified commit and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Confirm this verified commit is current
        id: current
        run: |
          git fetch origin main --tags
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        if: steps.current.outputs.release == 'true'
        run: corepack enable

      - name: Set up Node.js
        if: steps.current.outputs.release == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.current.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Re-run source verification before release preparation
        if: steps.current.outputs.release == 'true'
        run: pnpm verify

      - name: Bootstrap the existing extension version
        if: steps.current.outputs.release == 'true'
        id: bootstrap
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          if git tag --list 'v[0-9]*' | grep -q .; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(node -p "require('./apps/extension/manifest.base.json').version")"
          node --import tsx tooling/release/set-version.ts "$version"
          pnpm package:extension

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/manifest.base.json apps/extension/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $version [skip ci]"
          fi
          git tag -a "v$version" -m "Release v$version"
          git push origin HEAD:main "v$version"
          gh release create "v$version" \
            "artifacts/formfully-chrome-$version.zip" \
            "artifacts/formfully-chrome-$version.zip.sha256" \
            "artifacts/formfully-firefox-$version.zip" \
            "artifacts/formfully-firefox-$version.zip.sha256" \
            "artifacts/formfully-safari-$version.zip" \
            "artifacts/formfully-safari-$version.zip.sha256" \
            --title "FormFully $version" \
            --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create the next semantic release
        if: steps.current.outputs.release == 'true' && steps.bootstrap.outputs.created != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: pnpm release
