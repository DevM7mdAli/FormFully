name: Publish browser extension

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      store:
        description: Store to retry
        required: true
        default: both
        type: choice
        options:
          - both
          - chrome
          - edge

permissions:
  contents: read

concurrency:
  group: browser-store-release
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package all browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release version
        id: release
        run: |
          version="$(node -p "require('./apps/extension/manifest.base.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run checks and create browser packages
        run: pnpm check
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Upload immutable browser packages
        uses: actions/upload-artifact@v7
        with:
          name: formfully-v${{ steps.release.outputs.version }}
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  safari:
    name: Validate Safari package with Xcode
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Safari web extension
        run: pnpm build:extension safari

      - name: Convert to an Xcode project
        run: |
          xcrun safari-web-extension-converter apps/extension/dist/safari \
            --project-location "$RUNNER_TEMP/safari" \
            --app-name "FormFully" \
            --bundle-identifier io.github.devm7mdali.formfully \
            --swift --macos-only --copy-resources \
            --no-open --no-prompt --force

      - name: Build the unsigned Safari app extension
        run: |
          project="$(find "$RUNNER_TEMP/safari" -maxdepth 2 -name '*.xcodeproj' -print -quit)"
          if [ -z "$project" ]; then
            echo "The converter produced no Xcode project" >&2
            exit 1
          fi
          target="$(xcodebuild -list -project "$project" -json |
            node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).project.targets.find((name) => name.endsWith("Extension"))')"
          if [ "$target" = "undefined" ]; then
            echo "The converted project has no extension target" >&2
            exit 1
          fi
          xcodebuild build \
            -project "$project" \
            -target "$target" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload Safari Xcode project
        uses: actions/upload-artifact@v7
        with:
          name: formfully-safari-xcode-${{ github.sha }}
          path: |
            ${{ runner.temp }}/safari
            !${{ runner.temp }}/safari/**/build/**
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Attach all browser packages to GitHub Release
    needs: [package, safari]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified browser packages
        uses: actions/download-artifact@v7
        with:
          name: formfully-v${{ needs.package.outputs.version }}
          path: artifacts

      - name: Verify every release checksum
        working-directory: artifacts
        run: |
          for checksum in *.zip.sha256; do
            sha256sum --check "$checksum"
          done

      - name: Create or refresh release assets
        shell: bash
        run: |
          files=(artifacts/*.zip artifacts/*.zip.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag \
              --title "FormFully ${{ needs.package.outputs.version }}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  publish-chrome:
    name: Submit to Chrome Web Store
    needs: [package, safari]
    if: github.event_name != 'workflow_dispatch' || inputs.store == 'both' || inputs.store == 'chrome'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: browser-store-production

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      - name: Download verified browser packages
        uses: actions/download-artifact@v7
        with:
          name: formfully-v${{ needs.package.outputs.version }}
          path: artifacts

      - name: Verify Chrome package checksum
        working-directory: artifacts
        run: sha256sum --check formfully-chrome-${{ needs.package.outputs.version }}.zip.sha256

      - name: Upload and submit Chrome release
        run: >-
          pnpm publish:chrome --
          --artifact artifacts/formfully-chrome-${{ needs.package.outputs.version }}.zip
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}

  publish-edge:
    name: Submit to Microsoft Edge Add-ons
    needs: [package, safari]
    if: github.event_name != 'workflow_dispatch' || inputs.store == 'both' || inputs.store == 'edge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: browser-store-production

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      - name: Download verified browser packages
        uses: actions/download-artifact@v7
        with:
          name: formfully-v${{ needs.package.outputs.version }}
          path: artifacts

      - name: Verify Edge package checksum
        working-directory: artifacts
        run: sha256sum --check formfully-chrome-${{ needs.package.outputs.version }}.zip.sha256

      - name: Upload and submit Edge release
        run: >-
          pnpm publish:edge --
          --artifact artifacts/formfully-chrome-${{ needs.package.outputs.version }}.zip
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CERTIFICATION_NOTES: ${{ vars.EDGE_CERTIFICATION_NOTES }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
