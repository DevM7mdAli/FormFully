              "@type": "Question",
              "name": "Is Formfully free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, on both Chrome and Edge. There is no paywall or account. If it saves you time, you can buy the author a coffee."
              }
            },
            {
              "@type": "Question",
              "name": "Does any of my data leave the browser?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. It makes no network requests and has no analytics or trackers. Your mode, profile, Classic value, custom rules, and language setting are stored on your device."

              "@type": "Question",
              "name": "What is the difference between Classic and Smart?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Classic fills every field with one value, or generates values by field type. Smart reads what each field is for, fills in your profile, handles more kinds of controls, keeps answers you already entered, and applies your custom rules."
              }
            },
            {
              "@type": "Question",
              "name": "How do custom fields work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Add a field label or keyword and the value you want. A rule like Group number to 12 is saved on your device and wins over Smart mode's own guess."
              }
            },
            {
              "@type": "Question",
              "name": "Can I change the keyboard shortcut?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Open chrome://extensions/shortcuts, find Formfully's Fill inputs command, click the pencil icon, and choose a key combination the browser isn't already using."
              }
            },

              "@type": "Question",
              "name": "Which browsers are supported?",
